[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "bewerbungspilot"
version = "0.1.0"
description = "Local, evidence-based assistant for preparing and controlling job applications"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "pypdf==6.19.0",
    "reportlab==5.0.1",
    "tzdata==2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.bewerbungspilot]
stage = "public-pilot"
ollama_api = "http://127.0.0.1:11434"
